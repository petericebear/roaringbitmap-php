name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    # Check the current initiator, including manual runs and reruns.
    if: ${{ github.triggering_actor == 'petericebear' }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: php -d ffi.enable=0 tests/run.php

  native:
    if: ${{ github.triggering_actor == 'petericebear' }}
    strategy:
      matrix:
        # Keep Apple Silicon coverage; explicit labels avoid automatic OS migrations.
        os: [ubuntu-24.04, macos-26]
        php: ['8.2', '8.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ffi
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: bash tools/build-native.sh
      - shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export ROARING_LIBRARY="$PWD/.build/croaring/libroaring.dylib"
          else
            export ROARING_LIBRARY="$PWD/.build/croaring/libroaring.so"
          fi
          ROARING_REQUIRE_NATIVE=1 ROARING_REQUIRE_ORDER_INDEX=1 php -d ffi.enable=1 tests/run.php
      - shell: bash
        run: |
          cc -O1 -g -std=c11 -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I.build/croaring tests/native-order.c -o .build/native-order-sanitized
          .build/native-order-sanitized
      - run: bash tools/build-native.sh --stock
      - shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            export ROARING_LIBRARY="$PWD/.build/croaring/libroaring-stock.dylib"
          else
            export ROARING_LIBRARY="$PWD/.build/croaring/libroaring-stock.so"
          fi
          ROARING_REQUIRE_NATIVE=1 php -d ffi.enable=1 tests/run.php

  benchmarks:
    needs: [php, native]
    if: ${{ github.triggering_actor == 'petericebear' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # One publisher at a time keeps the artifact count bounded across runs/reruns.
    concurrency:
      group: benchmark-artifacts-main
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: ffi
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Check artifact retention and README publication helpers
        run: python3 tests/benchmark_ci.py
      - name: Build native accelerator and stock CRoaring
        run: |
          bash tools/build-native.sh
          bash tools/build-native.sh --stock
      - name: Benchmark package and native accelerator
        run: python3 benchmarks/ci.py --sizes 100000 1000000 --samples 3 --output "$RUNNER_TEMP/benchmark"
      - name: Make room for the new benchmark artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmarks/artifacts.py prune --keep 2
      - name: Upload complete benchmark bundle
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Enforce maximum of three benchmark artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 benchmarks/artifacts.py prune --keep 3
      - name: Publish measured performance in README
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: python3 benchmarks/artifacts.py publish --directory "$RUNNER_TEMP/benchmark" --artifact-id "$ARTIFACT_ID"
